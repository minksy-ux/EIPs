# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Deployment permissions are scoped to the deploy job below.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # Pin the image and Ruby patch so runner updates cannot select an unsupported binary.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout EIPs
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Merge Repos
        uses: ./.github/actions/merge-repos
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.7' # Keep the Ruby binary compatible with the pinned runner.
          bundler-cache: false
      - name: Install Ruby dependencies
        run: bundle install --jobs 4 --retry 3
      - name: Setup Pages (with PAT)
        id: pages_pat
        if: ${{ secrets.PAGES_TOKEN != '' }}
        uses: actions/configure-pages@v6
        with:
          enablement: true
          token: ${{ secrets.PAGES_TOKEN }}
      - name: Setup Pages (fallback)
        id: pages
        if: ${{ secrets.PAGES_TOKEN == '' }}
        uses: actions/configure-pages@v6
      - name: Expose Pages base path from PAT step
        if: ${{ steps.pages_pat.outcome == 'success' }}
        run: echo "PAGES_BASE_PATH=${{ steps.pages_pat.outputs.base_path }}" >> $GITHUB_ENV
      - name: Expose Pages base path from fallback step
        if: ${{ steps.pages_pat.outcome != 'success' }}
        run: echo "PAGES_BASE_PATH=${{ steps.pages.outputs.base_path }}" >> $GITHUB_ENV
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "$PAGES_BASE_PATH"
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # Deployment job
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
