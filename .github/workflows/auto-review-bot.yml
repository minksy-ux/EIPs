on:
  workflow_run:
    workflows:
      - Auto Review Bot Trigger
    types:
      - completed

name: Auto Review Bot
jobs:
  auto-review-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Run
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch PR Number
        id: fetch-pr-number
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          artifact_id=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "pr-number") | .id][0] // ""')

          if [[ -z "$artifact_id" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh run download "$RUN_ID" --repo "$REPOSITORY" --name pr-number --dir .

          if [[ -f pr-number.txt ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "pr-number artifact is missing pr-number.txt" >&2
            exit 1
          fi

      - name: Save PR Number
        id: save-pr-number
        if: ${{ steps.fetch-pr-number.outputs.exists == 'true' }}
        run: echo "pr=$(cat pr-number.txt)" >> "$GITHUB_OUTPUT"

      - name: Auto Review Bot
        id: auto-review-bot
        uses: ethereum/eip-review-bot@dist
        continue-on-error: true
        if: ${{ steps.fetch-pr-number.outputs.exists == 'true' }}
        with:
          token: ${{ secrets.TOKEN }}
          config: config/eip-editors.yml
          pr_number: ${{ steps.save-pr-number.outputs.pr }}