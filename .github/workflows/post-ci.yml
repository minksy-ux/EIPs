on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed

name: Post CI

# This is adapted from https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_run (2022-07-17)

jobs:
  on-failure:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Fetch PR Data
        id: fetch-pr-data
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          artifact_id=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "pr_number") | .id][0] // ""')

          if [[ -z "$artifact_id" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh run download "$RUN_ID" --repo "$REPOSITORY" --name pr_number --dir .

          if [[ -f pr_number && -f pr_sha && -f merge_sha ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number artifact is missing one or more expected files" >&2
            exit 1
          fi

      - name: Save PR Data
        id: save-pr-data
        if: ${{ steps.fetch-pr-data.outputs.exists == 'true' }}
        run: |
          {
            echo "pr_number=$(cat pr_number)"
            echo "pr_sha=$(cat pr_sha)"
            echo "merge_sha=$(cat merge_sha)"
          } >> "$GITHUB_OUTPUT"

      - name: Add Comment
        uses: marocchino/sticky-pull-request-comment@39c5b5dc7717447d0cba270cd115037d32d28443
        if: ${{ steps.fetch-pr-data.outputs.exists == 'true' && github.event.workflow_run.conclusion == 'failure' }}
        with:
          number: ${{ steps.save-pr-data.outputs.pr_number }}
          recreate: true
          message: |
            The commit ${{ steps.save-pr-data.outputs.pr_sha }} (as a parent of ${{ steps.save-pr-data.outputs.merge_sha }}) contains errors.
            Please inspect the [Run Summary](https://github.com/ethereum/EIPs/pull/${{ steps.save-pr-data.outputs.pr_number }}/files) for details.

      - name: Add Waiting Label
        uses: actions-ecosystem/action-add-labels@288072f1a3b596f4350fe135bcfe381a23abadef
        if: ${{ steps.fetch-pr-data.outputs.exists == 'true' && github.event.workflow_run.conclusion == 'failure' }}
        with:
          labels: w-ci
          number: ${{ steps.save-pr-data.outputs.pr_number }}
          repo: ${{ github.repository }}
          github_token: ${{ github.token }}

      - name: Remove Waiting Label
        uses: actions-ecosystem/action-remove-labels@d05162525702062b6bdef750ed8594fc024b3ed7
        if: ${{ steps.fetch-pr-data.outputs.exists == 'true' && github.event.workflow_run.conclusion != 'failure' }}
        with:
          labels: w-ci
          number: ${{ steps.save-pr-data.outputs.pr_number }}
          repo: ${{ github.repository }}
          github_token: ${{ github.token }}
